version: "3.8"

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tulasetu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tulasetu}
      POSTGRES_USER: ${POSTGRES_USER:-tulasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tulasetu_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tulasetu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tulasetu-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Django Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tulasetu-backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-tulasetu-dev-secret-key-change-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - POSTGRES_DB=${POSTGRES_DB:-tulasetu}
      - POSTGRES_USER=${POSTGRES_USER:-tulasetu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tulasetu_dev_2026}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - IDENTITY_PROVIDER=${IDENTITY_PROVIDER:-mock}
      - BLOCKCHAIN_SIDECAR_URL=http://fabric-sidecar:3001
      - BLOCKCHAIN_ENABLED=${BLOCKCHAIN_ENABLED:-true}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Next.js Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tulasetu-frontend
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_VERIFY_BASE_URL=${NEXT_PUBLIC_VERIFY_BASE_URL:-http://localhost:3000/verify}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  # ── Blockchain Sidecar (Fabric Gateway) ─────────────────────
  fabric-sidecar:
    build:
      context: ./blockchain/sidecar
      dockerfile: Dockerfile
    container_name: tulasetu-fabric-sidecar
    environment:
      - FABRIC_GATEWAY_ENABLED=${BLOCKCHAIN_ENABLED:-true}
      - PORT=3001
    ports:
      - "3001:3001"
    volumes:
      - ./blockchain/sidecar:/app
      - /app/node_modules
      - fabric_wallet:/app/wallet

  # ── PWA Inspector (Static Server) ──────────────────────────
  pwa-inspector:
    image: nginx:alpine
    container_name: tulasetu-pwa-inspector
    ports:
      - "8080:80"
    volumes:
      - ./pwa-inspector:/usr/share/nginx/html:ro
      - ./pwa-inspector/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  backend_media:
  fabric_wallet:
